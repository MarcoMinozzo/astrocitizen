[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrocitizen"
version = "0.0.1"
description = "Plataforma de astronomia observacional para citizen science"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AstroCitizen Contributors" }]
dependencies = [
  "astropy>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
packaging = [
  "pyinstaller>=6.0",
  "matplotlib>=3.7",
]
sky = [
  "astroquery>=0.4",
]
alpaca = [
  "alpyca>=2.0",
]
gui = [
  "PySide6>=6.6",
]
gui-web = [
  "PySide6-WebEngine>=6.6",
]
saas = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
astrocitizen = "astrocitizen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astrocitizen = [
  "programs/catalog/*.json",
  "shared/locales/*.json",
  "integrations/*/form_schema.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
